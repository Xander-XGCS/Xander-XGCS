  <title id="title">Xander Gray public operating profile</title>
  <desc id="desc">Xander Gray, founder and CEO, systems architect, and quantitative market researcher. Three traces show measured Schumann mode frequencies in Hz from Nagycenk&#x27;s Ez channel on 2023-02-20. Historical CC BY 4.0 station data, not a live feed. Channel emphasis animation does not change the underlying observations.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .state-marker { animation: markerBreath 12s ease-in-out infinite; }
    .telemetry-focus { opacity: .16; animation: telemetryFocus 12s ease-in-out infinite; }
    .sample-node { opacity: .34; animation: nodeRead 12s steps(1, end) infinite; }
    .channel-b { animation-delay: -4s; }
    .channel-c { animation-delay: -8s; }
    @keyframes markerBreath { 0%, 100% { opacity: .58; } 50% { opacity: .96; } }
    @keyframes telemetryFocus { 0%, 30%, 100% { opacity: .16; } 8%, 24% { opacity: 1; } }
    @keyframes nodeRead { 0%, 7%, 26%, 100% { opacity: .34; } 8%, 25% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .state-marker, .telemetry-focus, .sample-node { animation: none !important; }
      .telemetry-focus { opacity: .52; }
      .sample-node { opacity: .8; }
    }
  </style>

