<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="312" viewBox="0 0 1000 312" role="img" aria-labelledby="title desc"><title id="title">OPERATING INVARIANTS</title><desc id="desc">OPERATING INVARIANTS. A 6 item two-column instrument panel with accessible text details in the README.</desc><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><rect width="1000" height="312" fill="#080c10"/><path d="M18 28L28 18H972L982 28V284L972 294H28L18 284Z" fill="#0d141a" stroke="#46535e"/><path d="M18 18H34M18 18V34M982 18H966M982 18V34M18 294H34M18 294V278M982 294H966M982 294V278" stroke="#b8a06a" stroke-width="2" fill="none"/><text x="48" y="58" fill="#e8edf2" font-size="20" font-weight="700" >OPERATING INVARIANTS</text><text x="947" y="57" fill="#99a5af" font-size="12" font-weight="400" text-anchor="end">06 / PRINCIPLES</text><path d="M48 72H952" stroke="#46535e"/><path d="M48 92L55 85H488V134L481 141H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="85" width="4" height="56" fill="#72a8b8" opacity=".85"/><text x="64" y="119" fill="#72a8b8" font-size="14" font-weight="700" >01</text><text x="103" y="119" fill="#e8edf2" font-size="13.5" font-weight="600" >Preserve context.</text><path d="M512 92L519 85H952V134L945 141H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="85" width="4" height="56" fill="#b8a06a" opacity=".85"/><text x="528" y="119" fill="#b8a06a" font-size="14" font-weight="700" >02</text><text x="567" y="119" fill="#e8edf2" font-size="13.5" font-weight="600" >Treat uncertainty honestly.</text><path d="M48 158L55 151H488V200L481 207H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="151" width="4" height="56" fill="#72a8b8" opacity=".85"/><text x="64" y="185" fill="#72a8b8" font-size="14" font-weight="700" >03</text><text x="103" y="185" fill="#e8edf2" font-size="13.5" font-weight="600" >Keep humans involved where judgment matters.</text><path d="M512 158L519 151H952V200L945 207H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="151" width="4" height="56" fill="#b8a06a" opacity=".85"/><text x="528" y="185" fill="#b8a06a" font-size="14" font-weight="700" >04</text><text x="567" y="185" fill="#e8edf2" font-size="13.5" font-weight="600" >Prefer useful signal over output volume.</text><path d="M48 224L55 217H488V266L481 273H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="217" width="4" height="56" fill="#72a8b8" opacity=".85"/><text x="64" y="251" fill="#72a8b8" font-size="14" font-weight="700" >05</text><text x="103" y="251" fill="#e8edf2" font-size="13.5" font-weight="600" >Build systems that can still be understood.</text><path d="M512 224L519 217H952V266L945 273H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="217" width="4" height="56" fill="#b8a06a" opacity=".85"/><text x="528" y="251" fill="#b8a06a" font-size="14" font-weight="700" >06</text><text x="567" y="251" fill="#e8edf2" font-size="13.5" font-weight="600" >Test ideas against reality, not presentation quality.</text></g></svg>
