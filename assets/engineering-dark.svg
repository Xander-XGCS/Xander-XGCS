<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">ENGINEERING CAPABILITY MATRIX</title><desc id="desc">ENGINEERING CAPABILITY MATRIX. A 4 item two-column instrument panel with accessible text details in the README.</desc><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><rect width="1000" height="350" fill="#080c10"/><path d="M18 28L28 18H972L982 28V322L972 332H28L18 322Z" fill="#0d141a" stroke="#46535e"/><path d="M18 18H34M18 18V34M982 18H966M982 18V34M18 332H34M18 332V316M982 332H966M982 332V316" stroke="#b8a06a" stroke-width="2" fill="none"/><text x="48" y="58" fill="#e8edf2" font-size="20" font-weight="700" >ENGINEERING CAPABILITY MATRIX</text><text x="947" y="57" fill="#99a5af" font-size="12" font-weight="400" text-anchor="end">04 / CAPABILITIES</text><path d="M48 72H952" stroke="#46535e"/><path d="M48 92L55 85H488V192L481 199H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="85" width="4" height="114" fill="#72a8b8" opacity=".85"/><text x="66" y="106" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">01 / SYSTEMS</text><text x="66" y="133" fill="#e8edf2" font-size="18" font-weight="700" >Architecture &amp; integration</text><text x="66" y="160" fill="#c6ced5" font-size="12.5" font-weight="400" >Python, TypeScript, APIs, event-driven services</text><text x="66" y="179" fill="#c6ced5" font-size="12.5" font-weight="400" >Data pipelines, persistent state and memory</text><path d="M512 92L519 85H952V192L945 199H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="85" width="4" height="114" fill="#b8a06a" opacity=".85"/><text x="530" y="106" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">02 / AI &amp; MODELING</text><text x="530" y="133" fill="#e8edf2" font-size="18" font-weight="700" >Intelligence &amp; orchestration</text><text x="530" y="160" fill="#c6ced5" font-size="12.5" font-weight="400" >Machine learning, time-series, local inference</text><text x="530" y="179" fill="#c6ced5" font-size="12.5" font-weight="400" >Agent orchestration, retrieval, tool workflows</text><path d="M48 218L55 211H488V318L481 325H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="211" width="4" height="114" fill="#72a8b8" opacity=".85"/><text x="66" y="232" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">03 / INFRASTRUCTURE</text><text x="66" y="259" fill="#e8edf2" font-size="18" font-weight="700" >Private &amp; distributed compute</text><text x="66" y="286" fill="#c6ced5" font-size="12.5" font-weight="400" >Docker, self-hosted GPUs, MCP integrations</text><text x="66" y="305" fill="#c6ced5" font-size="12.5" font-weight="400" >CI/CD, cloud and edge deployments</text><path d="M512 218L519 211H952V318L945 325H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="211" width="4" height="114" fill="#b8a06a" opacity=".85"/><text x="530" y="232" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">04 / INTERFACES &amp; CONTROLS</text><text x="530" y="259" fill="#e8edf2" font-size="18" font-weight="700" >Human-commanded operations</text><text x="530" y="286" fill="#c6ced5" font-size="12.5" font-weight="400" >Dashboards, observability, permission boundaries</text><text x="530" y="305" fill="#c6ced5" font-size="12.5" font-weight="400" >Human approval flows and operator controls</text></g></svg>
