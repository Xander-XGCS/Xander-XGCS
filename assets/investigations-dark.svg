<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img" aria-labelledby="title desc"><title id="title">INVESTIGATION MATRIX</title><desc id="desc">INVESTIGATION MATRIX. A 6 item two-column instrument panel with accessible text details in the README.</desc><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><rect width="1000" height="386" fill="#080c10"/><path d="M18 28L28 18H972L982 28V358L972 368H28L18 358Z" fill="#0d141a" stroke="#46535e"/><path d="M18 18H34M18 18V34M982 18H966M982 18V34M18 368H34M18 368V352M982 368H966M982 368V352" stroke="#b8a06a" stroke-width="2" fill="none"/><text x="48" y="58" fill="#e8edf2" font-size="20" font-weight="700" >INVESTIGATION MATRIX</text><text x="947" y="57" fill="#99a5af" font-size="12" font-weight="400" text-anchor="end">06 / ACTIVE TRACKS</text><path d="M48 72H952" stroke="#46535e"/><path d="M48 92L55 85H488V163L481 170H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="85" width="4" height="85" fill="#72a8b8" opacity=".85"/><text x="66" y="106" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">01 / MARKETS</text><text x="66" y="133" fill="#e8edf2" font-size="17" font-weight="700" >Full-field market-state prediction</text><text x="66" y="157" fill="#c6ced5" font-size="13" font-weight="400" >From the complete heatmap edge</text><path d="M512 92L519 85H952V163L945 170H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="85" width="4" height="85" fill="#b8a06a" opacity=".85"/><text x="530" y="106" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">02 / AGENT SYSTEMS</text><text x="530" y="133" fill="#e8edf2" font-size="17" font-weight="700" >Supervised operations</text><text x="530" y="157" fill="#c6ced5" font-size="13" font-weight="400" >Durable memory and explicit approvals</text><path d="M48 187L55 180H488V258L481 265H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="180" width="4" height="85" fill="#72a8b8" opacity=".85"/><text x="66" y="201" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">03 / DECISION INTELLIGENCE</text><text x="66" y="228" fill="#e8edf2" font-size="17" font-weight="700" >Capital and opportunity allocation</text><text x="66" y="252" fill="#c6ced5" font-size="13" font-weight="400" >Decision systems for complex choices</text><path d="M512 187L519 180H952V258L945 265H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="180" width="4" height="85" fill="#b8a06a" opacity=".85"/><text x="530" y="201" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">04 / PRIVACY</text><text x="530" y="228" fill="#e8edf2" font-size="17" font-weight="700" >Representing human intent</text><text x="530" y="252" fill="#c6ced5" font-size="13" font-weight="400" >Without unnecessary context exposure</text><path d="M48 282L55 275H488V353L481 360H48Z" fill="#111a22" stroke="#46535e"/><rect x="48" y="275" width="4" height="85" fill="#72a8b8" opacity=".85"/><text x="66" y="296" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">05 / PROCEDURAL SYSTEMS</text><text x="66" y="323" fill="#e8edf2" font-size="17" font-weight="700" >Editable, persistent worlds</text><text x="66" y="347" fill="#c6ced5" font-size="13" font-weight="400" >Simulation with durable state</text><path d="M512 282L519 275H952V353L945 360H512Z" fill="#111a22" stroke="#46535e"/><rect x="512" y="275" width="4" height="85" fill="#b8a06a" opacity=".85"/><text x="530" y="296" fill="#99a5af" font-size="11" font-weight="400" letter-spacing=".7">06 / SYSTEM DESIGN</text><text x="530" y="323" fill="#e8edf2" font-size="17" font-weight="700" >Capability without opacity</text><text x="530" y="347" fill="#c6ced5" font-size="13" font-weight="400" >Systems remain understandable as they grow</text></g></svg>
