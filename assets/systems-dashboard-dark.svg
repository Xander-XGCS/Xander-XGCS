    <g transform="translate(0 386)">
      <rect x="48" y="0" width="904" height="66" fill="#0d141a" stroke="#26323c"/>
      <rect class="row-activity row-03" x="53" y="1" width="898" height="64" fill="#b8a06a"/>
      <rect x="48" y="0" width="5" height="66" fill="#8c794b"/>
      <text x="72" y="25" fill="#99a5af" font-size="11">SYS-03 / PRODUCT FORMATION</text>
      <text x="72" y="48" fill="#e8edf2" font-size="17">KAIROS DYNAMICS</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#111a22" stroke="#685d42"/>
      <text x="504" y="38" fill="#c4ae76" font-size="12" text-anchor="middle">FORMATION</text>
      <text x="672" y="39" fill="#c6ced5" font-size="14">DEPLOYABLE DECISION SYSTEMS</text>
      <rect class="status-light light-03" x="934" y="28" width="7" height="10" fill="#b8a06a"/>
    </g>

    <g transform="translate(0 456)">
      <rect x="48" y="0" width="904" height="66" fill="#0d141a" stroke="#26323c"/>
      <rect class="row-activity row-04" x="53" y="1" width="898" height="64" fill="#72a8b8"/>
      <rect x="48" y="0" width="5" height="66" fill="#53636f"/>
      <text x="72" y="25" fill="#99a5af" font-size="11">SYS-04 / REASONING</text>
      <text x="72" y="48" fill="#e8edf2" font-size="17">BEREAN</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#111a22" stroke="#46535e"/>
      <text x="504" y="38" fill="#b9c3cb" font-size="12" text-anchor="middle">DEPLOYED</text>
      <text x="672" y="39" fill="#c6ced5" font-size="14">EVIDENCE-GROUNDED REASONING</text>
      <rect class="status-light light-04" x="934" y="28" width="7" height="10" fill="#657783"/>
    </g>

    <g transform="translate(0 526)">
      <rect x="48" y="0" width="904" height="66" fill="#0d141a" stroke="#26323c"/>
      <rect class="row-activity row-05" x="53" y="1" width="898" height="64" fill="#72a8b8"/>
      <rect x="48" y="0" width="5" height="66" fill="#53636f"/>
      <text x="72" y="25" fill="#99a5af" font-size="11">SYS-05 / PROCEDURAL R&amp;D</text>
      <text x="72" y="48" fill="#e8edf2" font-size="17">TIKKARA</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#111a22" stroke="#46535e"/>
      <text x="504" y="38" fill="#b9c3cb" font-size="12" text-anchor="middle">FOUNDATIONAL R&amp;D</text>
      <text x="672" y="39" fill="#c6ced5" font-size="14">PERSISTENT WORLD SYSTEMS</text>
