<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Public systems status board</title>
  <desc id="desc">Five systems in view: Heatmap Strategy Lab is in active research, Valence is in private development, Kairos Dynamics is in formation, Berean is deployed, and Tikkara is foundational research and development.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .active-pulse { transform-box: fill-box; transform-origin: center; animation: activePulse 10s ease-in-out infinite; }
    .field-sweep { animation: fieldSweep 16s ease-in-out infinite; }
    @keyframes activePulse { 0%, 100% { opacity: .58; transform: scale(.88); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes fieldSweep { 0%, 8% { transform: translateY(0); opacity: .16; } 92%, 100% { transform: translateY(304px); opacity: .05; } }
    @media (prefers-reduced-motion: reduce) {
      .active-pulse, .field-sweep { animation: none !important; }
    }
  </style>
  <rect width="1000" height="700" fill="#07101d"/>
  <rect x="20" y="20" width="960" height="660" rx="8" fill="#0b1626" stroke="#29435f"/>
  <text class="sans" x="48" y="62" fill="#f4f7fb" font-size="23" font-weight="700">SYSTEMS STATUS BOARD</text>
  <text class="mono" x="820" y="61" fill="#8298ae" font-size="14">PUBLIC // 2026</text>

  <g class="mono">
    <rect x="48" y="88" width="208" height="98" rx="6" fill="#0f2033" stroke="#29435f"/>
    <text x="66" y="117" fill="#8298ae" font-size="14">PRIMARY MISSION</text>
    <text x="66" y="148" fill="#f4f7fb" font-size="18">Find signal early</text>
    <text x="66" y="170" fill="#f4f7fb" font-size="18">enough to act.</text>

    <rect x="280" y="88" width="208" height="98" rx="6" fill="#0f2033" stroke="#29435f"/>
    <text x="298" y="117" fill="#8298ae" font-size="14">OPERATING MODEL</text>
    <text x="298" y="157" fill="#52d6ff" font-size="18">HUMAN + MACHINE</text>

    <rect x="512" y="88" width="208" height="98" rx="6" fill="#0f2033" stroke="#29435f"/>
    <text x="530" y="117" fill="#8298ae" font-size="14">PRIMARY DOMAIN</text>
    <text x="530" y="157" fill="#d5b96e" font-size="18">DECISION INTEL.</text>

    <rect x="744" y="88" width="208" height="98" rx="6" fill="#0f2033" stroke="#29435f"/>
    <text x="762" y="117" fill="#8298ae" font-size="14">SYSTEMS IN VIEW</text>
    <text x="762" y="163" fill="#7be6ad" font-size="34" font-weight="700">05</text>
  </g>

  <g class="mono">
    <text x="72" y="229" fill="#8298ae" font-size="14">SYSTEM</text>
    <text x="490" y="229" fill="#8298ae" font-size="14" text-anchor="middle">STATE</text>
    <text x="650" y="229" fill="#8298ae" font-size="14">FUNCTION</text>
    <path d="M48 243H952" stroke="#29435f"/>
    <rect class="field-sweep" x="48" y="252" width="904" height="64" rx="5" fill="#52d6ff" opacity=".05"/>

    <g transform="translate(0 252)">
      <circle class="active-pulse" cx="64" cy="32" r="7" fill="#4bd69a"/>
      <text x="84" y="38" fill="#f4f7fb" font-size="17">HEATMAP STRATEGY LAB</text>
      <rect x="380" y="13" width="220" height="38" rx="19" fill="#143425" stroke="#286744"/>
      <text x="490" y="37" fill="#7be6ad" font-size="13" text-anchor="middle">ACTIVE RESEARCH</text>
      <text x="650" y="38" fill="#c1ceda" font-size="14">MARKET-FIELD MODELING</text>
      <path d="M48 70H952" stroke="#1d3046"/>
    </g>

    <g transform="translate(0 328)">
      <circle cx="64" cy="32" r="7" fill="#52d6ff"/>
      <text x="84" y="38" fill="#f4f7fb" font-size="17">VALENCE</text>
      <rect x="380" y="13" width="220" height="38" rx="19" fill="#102f3d" stroke="#225f79"/>
      <text x="490" y="37" fill="#76dcff" font-size="13" text-anchor="middle">PRIVATE DEVELOPMENT</text>
      <text x="650" y="38" fill="#c1ceda" font-size="14">NETWORK COORDINATION</text>
      <path d="M48 70H952" stroke="#1d3046"/>
    </g>

    <g transform="translate(0 404)">
      <circle cx="64" cy="32" r="7" fill="#d5b96e"/>
      <text x="84" y="38" fill="#f4f7fb" font-size="17">KAIROS DYNAMICS</text>
      <rect x="380" y="13" width="220" height="38" rx="19" fill="#352d18" stroke="#6f5a24"/>
      <text x="490" y="37" fill="#e6ce85" font-size="13" text-anchor="middle">FORMATION</text>
      <text x="650" y="38" fill="#c1ceda" font-size="14">DEPLOYABLE DECISION SYSTEMS</text>
      <path d="M48 70H952" stroke="#1d3046"/>
    </g>

    <g transform="translate(0 480)">
      <circle cx="64" cy="32" r="7" fill="#a5b4fc"/>
      <text x="84" y="38" fill="#f4f7fb" font-size="17">BEREAN</text>
      <rect x="380" y="13" width="220" height="38" rx="19" fill="#23243f" stroke="#4f5180"/>
      <text x="490" y="37" fill="#c4cbff" font-size="13" text-anchor="middle">DEPLOYED</text>
      <text x="650" y="38" fill="#c1ceda" font-size="14">EVIDENCE-GROUNDED REASONING</text>
      <path d="M48 70H952" stroke="#1d3046"/>
    </g>

    <g transform="translate(0 556)">
      <circle cx="64" cy="32" r="7" fill="#f59e8b"/>
      <text x="84" y="38" fill="#f4f7fb" font-size="17">TIKKARA</text>
      <rect x="380" y="13" width="220" height="38" rx="19" fill="#3c2521" stroke="#7c4a42"/>
      <text x="490" y="37" fill="#ffb3a4" font-size="13" text-anchor="middle">FOUNDATIONAL R&amp;D</text>
      <text x="650" y="38" fill="#c1ceda" font-size="14">PERSISTENT WORLD SYSTEMS</text>
    </g>
  </g>

  <text class="mono" x="48" y="655" fill="#8298ae" font-size="14">PUBLIC SUMMARY // ACTIVE DEVELOPMENT IS SELECTIVELY DISCLOSED</text>
</svg>
