<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Public systems register</title>
  <desc id="desc">A hard-edged systems register listing Heatmap Strategy Lab, Valence, Kairos Dynamics, Berean, and Tikkara with their current development states and functions.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .active-marker, .status-light { animation: markerBreath 12s ease-in-out infinite; }
    .light-02 { animation-delay: -2s; }
    .light-03 { animation-delay: -4s; }
    .light-04 { animation-delay: -6s; }
    .light-05 { animation-delay: -8s; }
    .row-activity { opacity: 0; animation: rowToggle 25s steps(1, end) infinite; }
    .row-02 { animation-delay: 5s; }
    .row-03 { animation-delay: 10s; }
    .row-04 { animation-delay: 15s; }
    .row-05 { animation-delay: 20s; }
    .circuit-pulse { opacity: .1; animation: circuitPulse 14s ease-in-out infinite; }
    .circuit-02 { animation-delay: -7s; }
    @keyframes markerBreath { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
    @keyframes rowToggle { 0%, 12% { opacity: .075; } 13%, 100% { opacity: 0; } }
    @keyframes circuitPulse { 0%, 100% { opacity: .1; } 24% { opacity: .72; } 44% { opacity: .1; } }
    @media (prefers-reduced-motion: reduce) {
      .active-marker, .status-light, .row-activity, .circuit-pulse { animation: none !important; }
    }
  </style>

  <rect width="1000" height="650" fill="#080c10"/>
  <polygon points="18,28 28,18 972,18 982,28 982,622 972,632 28,632 18,622" fill="#0d1319" stroke="#34414d"/>
  <path d="M18 18H34M18 18V34M982 18H966M982 18V34M18 632H34M18 632V616M982 632H966M982 632V616" stroke="#b8a06a" stroke-width="2"/>
  <text class="sans" x="48" y="62" fill="#e8edf2" font-size="23" font-weight="700" letter-spacing=".3">SYSTEMS REGISTER</text>
  <text class="mono" x="746" y="61" fill="#99a5af" font-size="13">PUBLIC SURFACE / REV 2026.08</text>
  <path d="M48 78H952" stroke="#46535e"/>

  <g class="mono">
    <polygon points="48,102 56,94 952,94 952,164 944,172 48,172" fill="#101820" stroke="#46535e"/>
    <path d="M350 94V172M650 94V172" stroke="#46535e"/>
    <rect x="48" y="94" width="4" height="78" fill="#b8a06a"/>
    <text x="68" y="120" fill="#99a5af" font-size="12" letter-spacing="1.2">PRIMARY MISSION</text>
    <text x="68" y="145" fill="#e8edf2" font-size="15">FIND SIGNAL EARLY</text>
    <text x="68" y="163" fill="#e8edf2" font-size="15">ENOUGH TO ACT</text>
    <text x="370" y="120" fill="#99a5af" font-size="12" letter-spacing="1.2">OPERATING MODEL</text>
    <text x="370" y="151" fill="#8fb8c4" font-size="17">HUMAN + MACHINE</text>
    <text x="670" y="120" fill="#99a5af" font-size="12" letter-spacing="1.2">SYSTEMS IN VIEW</text>
    <text x="670" y="153" fill="#e8edf2" font-size="25" font-weight="700">05</text>
    <text x="724" y="151" fill="#99a5af" font-size="12">SELECTIVE DISCLOSURE</text>

    <rect x="48" y="196" width="904" height="40" fill="#111a22" stroke="#46535e"/>
    <text x="78" y="221" fill="#99a5af" font-size="12" letter-spacing="1.2">SYSTEM / IDENTIFIER</text>
    <text x="410" y="221" fill="#99a5af" font-size="12" letter-spacing="1.2">STATE</text>
    <text x="672" y="221" fill="#99a5af" font-size="12" letter-spacing="1.2">FUNCTION</text>
    <path d="M34 214V584M34 279H48M34 349H48M34 419H48M34 489H48M34 559H48M966 214V584M952 279H966M952 349H966M952 419H966M952 489H966M952 559H966" fill="none" stroke="#26323c"/>
    <path class="circuit-pulse circuit-01" d="M34 214V419M34 279H48M34 349H48M34 419H48" fill="none" stroke="#72a8b8"/>
    <path class="circuit-pulse circuit-02" d="M966 349V584M952 349H966M952 419H966M952 489H966M952 559H966" fill="none" stroke="#b8a06a"/>

    <g transform="translate(0 246)">
      <rect x="48" y="0" width="904" height="66" fill="#0d141a" stroke="#26323c"/>
      <rect class="row-activity row-01" x="53" y="1" width="898" height="64" fill="#72a8b8"/>
      <rect class="active-marker" x="48" y="0" width="5" height="66" fill="#75a98d"/>
      <text x="72" y="25" fill="#99a5af" font-size="11">SYS-01 / MARKET RESEARCH</text>
      <text x="72" y="48" fill="#e8edf2" font-size="17">HEATMAP STRATEGY LAB</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#111a22" stroke="#587765"/>
      <text x="504" y="38" fill="#8db89f" font-size="12" text-anchor="middle">ACTIVE RESEARCH</text>
      <text x="672" y="39" fill="#c6ced5" font-size="14">MARKET-FIELD MODELING</text>
      <rect class="status-light light-01" x="934" y="28" width="7" height="10" fill="#75a98d"/>
    </g>

    <g transform="translate(0 316)">
      <rect x="48" y="0" width="904" height="66" fill="#0d141a" stroke="#26323c"/>
      <rect class="row-activity row-02" x="53" y="1" width="898" height="64" fill="#72a8b8"/>
      <rect x="48" y="0" width="5" height="66" fill="#53636f"/>
      <text x="72" y="25" fill="#99a5af" font-size="11">SYS-02 / NETWORKS</text>
      <text x="72" y="48" fill="#e8edf2" font-size="17">VALENCE</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#111a22" stroke="#46535e"/>
      <text x="504" y="38" fill="#b9c3cb" font-size="12" text-anchor="middle">PRIVATE DEVELOPMENT</text>
