.scan-frame {opacity:0;animation:highlight 30s steps(1,end) infinite;}
.pulse {animation:glow 8s ease-in-out infinite;}
@keyframes highlight {0%,3.2%{opacity:1;} 3.334%,100%{opacity:0;}}
@keyframes glow {0%,100%{opacity:.5;} 50%{opacity:1;}}
@media (prefers-reduced-motion:reduce) {.scan-frame,.pulse{animation:none!important;} .scan-frame{opacity:0;} #first-frame{opacity:1;}}
</style>
