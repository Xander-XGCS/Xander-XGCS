<title id="title">Schumann resonance / 30-day historical frequency scan</title>
<desc id="desc">Animated inspection cursor moving across reported Tomsk Schumann resonance fundamental-frequency readings, sampled one valid observation per UTC day from October 10 to November 8, 2026. The final seven days are explicitly unavailable because the source went offline. This is a dated historical snapshot, not a live spectrogram.</desc>
