  <rect class="state-marker" x="942" y="42" width="9" height="9" fill="#2f6e52"/>

  <text class="sans" x="48" y="137" fill="#18222b" font-size="45" font-weight="700" letter-spacing=".4">XANDER GRAY</text>
  <text class="mono" x="50" y="173" fill="#46545f" font-size="15">FOUNDER &amp; CEO / SYSTEMS ARCHITECT / QUANTITATIVE MARKET RESEARCH</text>

  <polygon points="48,201 676,201 684,209 684,240 676,248 48,248" fill="#f1f3f5" stroke="#8c98a2"/>
  <rect x="48" y="201" width="4" height="47" fill="#336f80"/>
