<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Xander Gray public operating profile</title>
  <desc id="desc">A hard-edged institutional header identifying Xander Gray as founder and CEO, systems architect, and quantitative market researcher. A compact line plot represents signal research.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .state-marker { animation: markerBreath 12s ease-in-out infinite; }
    .circuit-segment { opacity: .1; animation: circuitPulse 15s ease-in-out infinite; }
    .circuit-b { animation-delay: -5s; }
    .circuit-c { animation-delay: -10s; }
    @keyframes markerBreath { 0%, 100% { opacity: .58; } 50% { opacity: .96; } }
    @keyframes circuitPulse { 0%, 100% { opacity: .1; } 18% { opacity: .82; } 36% { opacity: .1; } }
    @media (prefers-reduced-motion: reduce) {
      .state-marker, .circuit-segment { animation: none !important; }
    }
  </style>

  <rect width="1000" height="300" fill="#eef0f2"/>
  <polygon points="18,28 28,18 972,18 982,28 982,272 972,282 28,282 18,272" fill="#f8f9fa" stroke="#7f8b95"/>
