  <text class="mono" x="66" y="239" fill="#2f6f83" font-size="14">MARKET FIELDS / DECISION INTELLIGENCE / HUMAN-CONTROLLED AI</text>
  <text class="mono" x="48" y="269" fill="#4c5a66" font-size="12">SILICON VALLEY, CA  /  PUBLIC RESEARCH SURFACE</text>

