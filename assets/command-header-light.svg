<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Xander Gray public operating profile</title>
  <desc id="desc">A restrained command header identifying Xander Gray as founder and CEO, systems architect, and quantitative market researcher. Current focus is decision systems, market research, and human-controlled AI.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .status-pulse { transform-box: fill-box; transform-origin: center; animation: statusPulse 9s ease-in-out infinite; }
    .signal-trace { animation: signalDrift 14s linear infinite; }
    @keyframes statusPulse { 0%, 100% { opacity: .62; transform: scale(.86); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes signalDrift { to { stroke-dashoffset: -96; } }
    @media (prefers-reduced-motion: reduce) {
      .status-pulse, .signal-trace { animation: none !important; }
    }
  </style>
  <rect width="1000" height="320" fill="#eef3f8"/>
  <rect x="20" y="20" width="960" height="280" rx="8" fill="#ffffff" stroke="#c4d2df"/>
  <path d="M20 82H980" stroke="#d4dfe9"/>
  <path d="M44 45H214" stroke="#9d7b27" stroke-width="3"/>
  <text class="mono" x="44" y="66" fill="#82651f" font-size="16" letter-spacing="1.6">PUBLIC OPERATING PROFILE // XGCS</text>
  <circle class="status-pulse" cx="946" cy="51" r="6" fill="#168a5b"/>

  <text class="sans" x="52" y="148" fill="#0c1a2a" font-size="45" font-weight="700" letter-spacing=".7">XANDER GRAY</text>
  <text class="mono" x="52" y="185" fill="#51677e" font-size="16">FOUNDER &amp; CEO · SYSTEMS ARCHITECT · QUANTITATIVE RESEARCHER</text>

  <rect x="52" y="211" width="666" height="45" rx="5" fill="#f6f9fc" stroke="#ccd8e4"/>
  <text class="mono" x="70" y="230" fill="#5c7085" font-size="13" letter-spacing="1.1">CURRENT FOCUS</text>
  <text class="mono" x="70" y="248" fill="#087ca3" font-size="14">MARKET FIELDS / DECISION INTELLIGENCE / HUMAN-CONTROLLED AI</text>

  <g transform="translate(780 106)">
    <circle cx="76" cy="66" r="60" fill="none" stroke="#c4d2df" stroke-width="2"/>
    <circle cx="76" cy="66" r="39" fill="none" stroke="#8ba3ba" stroke-width="2" stroke-dasharray="4 7"/>
    <path d="M16 66H136M76 6V126" stroke="#c4d2df"/>
    <path class="signal-trace" d="M22 81C41 47 58 88 76 60S111 38 130 57" fill="none" stroke="#9d7b27" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 8"/>
    <circle cx="76" cy="66" r="5" fill="#087ca3"/>
  </g>

  <text class="mono" x="44" y="282" fill="#5c7085" font-size="14">SILICON VALLEY, CA</text>
  <text class="mono" x="826" y="282" fill="#116a45" font-size="14">STATUS // ACTIVE</text>
</svg>
