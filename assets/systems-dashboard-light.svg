    </g>

    <g transform="translate(0 386)">
      <rect x="48" y="0" width="904" height="66" fill="#f8f9fa" stroke="#b3bcc3"/>
      <rect class="row-activity row-03" x="53" y="1" width="898" height="64" fill="#6f5c32"/>
      <rect x="48" y="0" width="5" height="66" fill="#806d3f"/>
      <text x="72" y="25" fill="#4c5a66" font-size="11">SYS-03 / PRODUCT FORMATION</text>
      <text x="72" y="48" fill="#18222b" font-size="17">KAIROS DYNAMICS</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#f1f3f5" stroke="#8b7a55"/>
      <text x="504" y="38" fill="#6f5c32" font-size="12" text-anchor="middle">FORMATION</text>
      <text x="672" y="39" fill="#34424e" font-size="14">DEPLOYABLE DECISION SYSTEMS</text>
      <rect class="status-light light-03" x="934" y="28" width="7" height="10" fill="#806d3f"/>
    </g>

    <g transform="translate(0 456)">
      <rect x="48" y="0" width="904" height="66" fill="#f8f9fa" stroke="#b3bcc3"/>
      <rect class="row-activity row-04" x="53" y="1" width="898" height="64" fill="#336f80"/>
      <rect x="48" y="0" width="5" height="66" fill="#65727c"/>
      <text x="72" y="25" fill="#4c5a66" font-size="11">SYS-04 / REASONING</text>
      <text x="72" y="48" fill="#18222b" font-size="17">BEREAN</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#f1f3f5" stroke="#7f8b95"/>
      <text x="504" y="38" fill="#34424e" font-size="12" text-anchor="middle">DEPLOYED</text>
      <text x="672" y="39" fill="#34424e" font-size="14">EVIDENCE-GROUNDED REASONING</text>
      <rect class="status-light light-04" x="934" y="28" width="7" height="10" fill="#65727c"/>
    </g>

    <g transform="translate(0 526)">
      <rect x="48" y="0" width="904" height="66" fill="#f8f9fa" stroke="#b3bcc3"/>
      <rect class="row-activity row-05" x="53" y="1" width="898" height="64" fill="#336f80"/>
      <rect x="48" y="0" width="5" height="66" fill="#65727c"/>
      <text x="72" y="25" fill="#4c5a66" font-size="11">SYS-05 / PROCEDURAL R&amp;D</text>
      <text x="72" y="48" fill="#18222b" font-size="17">TIKKARA</text>
      <polygon points="392,25 400,17 616,17 616,41 608,49 392,49" fill="#f1f3f5" stroke="#7f8b95"/>
      <text x="504" y="38" fill="#34424e" font-size="12" text-anchor="middle">FOUNDATIONAL R&amp;D</text>
      <text x="672" y="39" fill="#34424e" font-size="14">PERSISTENT WORLD SYSTEMS</text>
