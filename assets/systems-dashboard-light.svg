<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Public systems register</title>
  <desc id="desc">A hard-edged systems register listing Heatmap Strategy Lab, Valence, Kairellian, Berean, and Tikkara with their current development states and functions.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .power-source { animation: sourceBreath 10s ease-in-out infinite; }
    .power-trunk, .power-lead { opacity: .06; animation: trunkPower 25s ease-in-out infinite; }
    .power-lead { animation-name: leadPower; }
    .power-port, .status-light, .row-terminal { opacity: .3; animation: terminalPower 25s steps(1, end) infinite; }
    .row-activity { opacity: 0; animation: rowPower 25s steps(1, end) infinite; }
    .power-02, .row-02, .light-02 { animation-delay: -5s; }
    .power-03, .row-03, .light-03 { animation-delay: -10s; }
    .power-04, .row-04, .light-04 { animation-delay: -15s; }
    .power-05, .row-05, .light-05 { animation-delay: -20s; }
    @keyframes sourceBreath { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }
    @keyframes trunkPower { 0%, 2%, 18%, 100% { opacity: .06; } 4%, 13% { opacity: .78; } }
    @keyframes leadPower { 0%, 4%, 19%, 100% { opacity: .06; } 6%, 15% { opacity: .88; } }
    @keyframes terminalPower { 0%, 6%, 20%, 100% { opacity: .3; } 8%, 18% { opacity: 1; } }
    @keyframes rowPower { 0%, 8%, 20%, 100% { opacity: 0; } 9%, 19% { opacity: .055; } }
    @media (prefers-reduced-motion: reduce) {
      .power-source, .power-trunk, .power-lead, .power-port, .status-light, .row-terminal, .row-activity { animation: none !important; }
      .power-trunk, .power-lead { opacity: .28; }
      .power-port, .status-light, .row-terminal { opacity: .74; }
      .row-activity { opacity: .02; }
    }
  </style>

  <rect width="1000" height="650" fill="#eef0f2"/>
